<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body>
    <div class="auth-bg">
        <div class="auth-card">
            <div class="logo">
                <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
                    <polygon points="24,4 44,14 44,34 24,44 4,34 4,14" fill="#7c3aed"/>
                    <text x="24" y="30" text-anchor="middle" fill="white" font-size="16" font-weight="bold" font-family="sans-serif">N</text>
                </svg>
                <span>NEXORA</span>
            </div>

            <div class="tabs">
                <button class="tab active" onclick="switchTab('login')">Entrar</button>
                <button class="tab" onclick="switchTab('register')">Criar Conta</button>
            </div>

            <form id="loginForm" class="auth-form">
                <h2>Bem-vindo de volta!</h2>
                <label>Nome de exibição</label>
                <input type="text" id="loginDisplayName" placeholder="Seu nome de exibição" required>
                <label>Senha</label>
                <input type="password" id="loginPassword" placeholder="••••••••" required>
                <button type="submit" class="btn-primary">Entrar</button>
                <p class="error" id="loginError"></p>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <h2>Criar sua conta</h2>
                <label>Nome de usuário</label>
                <input type="text" id="regUsername" placeholder="johndoe" required>
                <label>Nome de exibição (único)</label>
                <input type="text" id="regDisplayName" placeholder="John Doe" required>
                <label>E-mail</label>
                <input type="email" id="regEmail" placeholder="seu@email.com" required>
                <label>Senha</label>
                <input type="password" id="regPassword" placeholder="••••••••" required>
                <button type="submit" class="btn-primary">Criar Conta</button>
                <p class="error" id="registerError"></p>
            </form>
        </div>
    </div>
    <script src="js/auth.js"></script>
</body>
</html>
