spring.application.name=nexora

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:nexora}
spring.datasource.username=${PGUSER:postgres}
# Sem default: defina a variável de ambiente PGPASSWORD (nunca versione a senha real)
spring.datasource.password=${PGPASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
# Sem default: defina JWT_SECRET (>= 32 chars aleatórios). O app não sobe sem isso.
nexora.jwt.secret=${JWT_SECRET}
nexora.jwt.expiration=86400000

# CORS — lista separada por vírgula das origens permitidas (defina em produção)
nexora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://localhost:5173}

# Server
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=-1
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
