spring.application.name=nexora

# PostgreSQL — usa variável do Railway em produção, fallback local para dev
spring.datasource.url=${JDBC_DATABASE_URL:jdbc:postgresql://localhost:5432/nexora}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:361361}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
nexora.jwt.secret=${JWT_SECRET:NexoraSecretKey2024SuperSecureKeyForJWTSigning123456789}
nexora.jwt.expiration=86400000

# Server
server.port=${PORT:8080}
server.tomcat.max-http-form-post-size=-1
spring.servlet.multipart.max-file-size=20MB
spring.servlet.multipart.max-request-size=20MB
